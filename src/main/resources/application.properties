spring.application.name=SpringRest-Proj12-MiniProject03-LibraryCURD
server.port=4040
server.servlet.context-path=/RestMiniProject3

#mysql 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql:///springboot
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=1000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.keepalive-time=100000
#jpa
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#Hibernate properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true


spring.main.banner-mode=off
